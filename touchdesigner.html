<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Video Compositing with TouchDesigner Systems - Land Buoy Max Coker</title>

  <!-- Scripts and assets -->
  <script
    type="text/javascript"
    src="https://code.jquery.com/jquery-1.11.0.min.js"
  ></script>
  <script
    type="text/javascript"
    src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"
    integrity="sha512-uto9mlQzrs59VwILcLiRYeLKPPbS/bT71da/OEBYEwcdNUk8jYIy+D176RYoop1Da+f9mvkYrmj5MCLZWEtQuA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <!-- jQuery UI Touch Punch - enables touch support for draggable -->
  <script src="https://cdn.jsdelivr.net/npm/jquery-ui-touch-punch@0.2.3/jquery.ui.touch-punch.min.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css" />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="assets/img/favicon/icon 3.png"
  />
</head>

<body>
  <!-- Main container -->
  <div class="mainContainer">
    <!-- Title Bar -->
    <div class="titleBar">
      <div class="logoContainer logoContainer--gallery">
        <div class="logoContainer__inner">
          VIDEO COMPOSITING WITH TOUCHDESIGNER SYSTEMS
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <a class="button button--home" href="index.html">
        Home
      </a>
    </nav>

    <!-- Glyph container: gallery glyphs go inside .landbuoyProjects -->
    <div class="landbuoyContainers">
      <div class="landbuoy">
        <div class="landbuoyProjects">
          <div class="glyph glyph--photonPlayground">
            <img
              class="glyphIcon"
              src="assets/img/gifs/photonPlaygroundGlyph.gif"
              alt="Photon Playground"
            />         
          </div>

          <div class="glyph glyph--hausaufgabe">
            <img
              class="glyphIcon"
              src="assets/img/gifs/Hausaufgabe.GIF"
              alt="Hausaufgabe"
            />                 
          </div>

          <div class="glyph glyph--horses">
            <img
              class="glyphIcon"
              src="assets/img/gifs/horses glyph.gif"
              alt="horses"
            />         
          </div>
          <div class="glyph glyph--wesleyanBirds">
            <img
              class="glyphIcon"
              src="assets/img/button/land buoy modals/wesleyan birds.png"
              alt="wesleyan birds"
            />         
          </div>
          <div class="glyph glyph--ballet">
            <img
              class="glyphIcon"
              src="assets/img/gifs/ballet.gif"
              alt="ballet"
            />         
          </div>
          <div class="glyph glyph--dancyArms">
            <img
              class="glyphIcon"
              src="assets/img/gifs/dancy arms.gif"
              alt="dancy arms"
            />         
          </div>
          <div class="glyph glyph--dancers">
            <img
              class="glyphIcon"
              src="assets/img/gifs/dancers01cap004.gif"
              alt="dancers"
            />         
          </div>
          <div class="glyph glyph--mercuralia">
            <img
              class="glyphIcon"
              src="assets/img/gifs/mercuralia hack snag.gif"
              alt="mercuralia"
            />         
          </div>
          <div class="glyph glyph--grass">
            <img
              class="glyphIcon"
              src="assets/img/gifs/grass.gif"
              alt="grass"
            />         
          </div>
        </div>
      </div>
    </div>

    <!-- Modals -->
    <!-- Photon Playground modal -->
    <div class="modalContainer modalContainer--photonPlayground">
      <video id="photonPlayground" autoplay loop>
        <source src="assets/vid/photonPlaygroundDoc.mp4" type="video/mp4">
      </video>        
    </div>

    <!-- Hausaufgabe modals -->
    <div class="modalContainer modalContainer--hausaufgabe" style="display: none;">
      <video id="hausaufgabeVideo" loop preload="auto">
        <source src="assets/vid/hausaufgabe upload.mp4" type="video/mp4">
      </video> 
    </div>

    <!-- Horses modal -->
    <div class="modalContainer modalContainer--horses">
      <div class="youtubeDragHandle"></div>
      <iframe 
        id="horsesVideo"
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/Pc_pjxAs4D4?si=X1VlkkWA5PtMwOW3&autoplay=1&controls=0&mute=1&loop=1&playlist=Pc_pjxAs4D4" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>        
    </div>

    <!-- Wesleyan Birds modal -->
    <div class="modalContainer modalContainer--wesleyanBirds">
      <div class="youtubeDragHandle"></div>
      <iframe 
        id="wesleyanBirdsVideo"
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/VU7Y9cVwBMQ?si=UkeZ5zj_CemGh_NS&autoplay=1&controls=0&mute=1&loop=1&playlist=VU7Y9cVwBMQ" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>        
    </div>

    <!-- Dancy Arms modal -->
    <div class="modalContainer modalContainer--dancyArms">
      <div class="youtubeDragHandle"></div>
      <iframe 
        id="dancyArmsVideo"
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/0s4i_zfuqxo?si=kf-axDoDKIvzsyL8&autoplay=1&controls=0&mute=1&loop=1&playlist=0s4i_zfuqxo" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>        
    </div>

    <!-- Dancers modal -->
    <div class="modalContainer modalContainer--dancers">
      <div class="youtubeDragHandle"></div>
      <iframe 
        id="dancersVideo"
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/FEP4cFj-xYM?si=hKUIjq4zYJU3u0cI&autoplay=1&controls=0&mute=1&loop=1&playlist=FEP4cFj-xYM" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>        
    </div>

    <!-- Mercuralia modal -->
    <div class="modalContainer modalContainer--mercuralia" style="display: none;">
      <img 
        id="mercuraliaGif"
        src="assets/img/gifs/mercuralia hack snag.gif" 
        alt="mercuralia hack snag"
        style="width: 100%; height: 100%; object-fit: contain;"
      />
    </div>

    <!-- Grass modal -->
    <div class="modalContainer modalContainer--grass">
      <div class="youtubeDragHandle"></div>
      <iframe 
        id="grassVideo"
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/iUazfKJweYI?si=KjsPWsEbqU8r40IX&autoplay=1&controls=0&mute=1&loop=1&playlist=iUazfKJweYI" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>        
    </div>

    <!-- Ballet modal -->
    <div class="modalContainer modalContainer--ballet" style="display: none;">
      <video id="balletVideo" autoplay loop>
        <source src="assets/vid/ballet01.mp4" type="video/mp4">
      </video>        
    </div> 
  </div>

  <script type="text/javascript" src="assets/js/gallery.js"></script>
  <script type="text/javascript" src="assets/js/modalAudio.js"></script>
  <script type="text/javascript" src="assets/js/touchdesigner.js"></script>

  <!-- YouTube Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
